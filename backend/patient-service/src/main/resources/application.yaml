server:
  port: 8085

spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:mysql://localhost:3306/mediq_patient_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect


application:
  security:
    jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}